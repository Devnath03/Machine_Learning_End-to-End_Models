<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detection</title>
</head>
<body>
    <h1>Email Spam Detection</h1>
    <form method="POST">
        <label for="email">Enter Email Content:</label><br>
        <textarea id="email" name="email" rows="10" cols="50"></textarea><br>
        <input type="submit" value="Check Spam">
    </form>
    {% if prediction is not none %}
        <h2>Prediction: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
